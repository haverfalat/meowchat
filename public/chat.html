<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>meowchat</title>
  <link id="favicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23fff'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='18' text-anchor='middle' fill='%23000'%3E:3%3C/text%3E%3C/svg%3E">
  <style>
    * {
      line-height: 14px;
    }
    body {
      font-family: monospace;
      margin: 16px 8px;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .box {
      width: 100%;
      max-width: 760px;
    }
    .layout {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }
    #online-box {
      width: 150px;
      flex-shrink: 0;
      border: 1px solid #000;
      padding: 8px;
      box-sizing: border-box;
    }
    #online-box pre {
      margin: 0;
    }
    .chat-col {
      flex: 1;
      min-width: 0;
    }
    @media (max-width: 640px) {
      .layout {
        flex-direction: column;
      }
      #online-box {
        width: 100%;
      }
    }
    hr {
      width: 100%;
    }
    #messages {
      height: calc(100vh - 210px);
      min-height: 260px;
      max-height: 680px;
      overflow-y: auto;
      border: 1px solid #000;
      padding: 8px;
      box-sizing: border-box;
    }
    #jump-latest {
      display: none;
      margin-top: 4px;
      font-size: 11px;
    }
    .addr-link {
      cursor: pointer;
    }
    .addr-link:hover {
      text-decoration: underline;
    }
    .msg {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 2px;
    }
    .msg.ping {
      background: #fff3cd;
    }
    .msg-line {
      white-space: pre-wrap;
      word-break: break-word;
    }
    .seen {
      color: #666;
      font-size: 11px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    #chat-form {
      position: relative;
      display: flex;
      gap: 6px;
      width: 100%;
    }
    #msg-input {
      flex: 1;
    }
    .user-link {
      cursor: pointer;
      font-weight: bold;
    }
    .user-link:hover {
      text-decoration: underline;
    }
    .mention {
      font-weight: bold;
    }
    #mention-menu {
      display: none;
      position: absolute;
      bottom: 100%;
      left: 0;
      margin-bottom: 4px;
      background: #fff;
      border: 1px solid #000;
      min-width: 160px;
      max-height: 140px;
      overflow-y: auto;
      z-index: 10;
    }
    .mention-item {
      padding: 3px 8px;
      cursor: pointer;
    }
    .mention-item.active,
    .mention-item:hover {
      background: #eee;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="box">
      <div style="display: flex; justify-content: center; align-items: center; gap: 16px; flex-wrap: wrap;">
        <div style="font-size: 44px; line-height: 44px;">:3</div>
        <pre>meowchat <span id="conn-status">[connecting...]</span>
<span id="whoami">...</span>
<a href="#" id="sound-toggle">[sound: on]</a> <a href="#" id="clear-link" style="display:none">[clear]</a> <a href="#" id="logout-link">[logout]</a></pre>
        <div style="border-left: 1px solid #000; padding-left: 16px;">
          <pre id="addresses" style="margin: 0;">...</pre>
        </div>
      </div>
      <hr>
      <div class="layout">
        <div id="online-box">
          <pre>online (<span id="online-count">0</span>)</pre>
          <hr>
          <pre id="online">...</pre>
        </div>
        <div class="chat-col">
          <div id="messages"></div>
          <div id="jump-latest"><a href="#" id="jump-link">[new messages ↓]</a></div>
          <pre id="typing">&nbsp;</pre>
          <form id="chat-form">
            <div id="mention-menu"></div>
            <input id="msg-input" type="text" placeholder="say something... (@ to mention)" autocomplete="off" maxlength="2000">
            <button type="submit">send</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script>
    const whoamiEl = document.getElementById('whoami');
    const connStatusEl = document.getElementById('conn-status');
    const soundToggleEl = document.getElementById('sound-toggle');
    const addressesEl = document.getElementById('addresses');
    const onlineCountEl = document.getElementById('online-count');
    const onlineEl = document.getElementById('online');
    const messagesEl = document.getElementById('messages');
    const jumpLatestEl = document.getElementById('jump-latest');
    const jumpLinkEl = document.getElementById('jump-link');
    const typingEl = document.getElementById('typing');
    const chatForm = document.getElementById('chat-form');
    const msgInput = document.getElementById('msg-input');
    const clearLink = document.getElementById('clear-link');
    const logoutLink = document.getElementById('logout-link');

    let isAdmin = false;

    let soundOn = localStorage.getItem('meow_sound') !== '0';
    function updateSoundLabel() {
      soundToggleEl.textContent = soundOn ? '[sound: on]' : '[sound: off]';
    }
    updateSoundLabel();
    soundToggleEl.addEventListener('click', (e) => {
      e.preventDefault();
      soundOn = !soundOn;
      localStorage.setItem('meow_sound', soundOn ? '1' : '0');
      updateSoundLabel();
    });

    function playPingBeep() {
      if (!soundOn) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1175, ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.06, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.14);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.15);
      } catch {}
    }

    let currentUser = '';
    let ws = null;
    let messages = [];
    let onlineUsers = [];
    let typingStopTimer = null;
    let lastTypingSent = 0;

    const NAME_COLORS = [
      '#b91c1c', '#0369a1', '#15803d', '#7e22ce', '#c2410c',
      '#0f766e', '#be185d', '#4338ca', '#a16207', '#1d4ed8',
    ];

    function userColor(name) {
      let h = 0;
      const s = String(name || '').toLowerCase();
      for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
      return NAME_COLORS[h % NAME_COLORS.length];
    }

    function insertMention(name) {
      const val = msgInput.value;
      const pos = msgInput.selectionStart ?? val.length;
      const before = val.slice(0, pos);
      const after = val.slice(pos);
      const replaced = before.replace(/@[a-zA-Z0-9_-]*$/, '');
      const prefix = replaced.length > 0 && !/\s$/.test(replaced) && replaced === before ? `${replaced} ` : replaced;
      const insert = `@${name} `;
      msgInput.value = prefix + insert + after;
      const nextPos = prefix.length + insert.length;
      msgInput.focus();
      msgInput.setSelectionRange(nextPos, nextPos);
      closeMentionMenu();
    }

    function renderOnline(users) {
      onlineUsers = users || [];
      onlineCountEl.textContent = String(onlineUsers.length);
      onlineEl.textContent = '';
      if (onlineUsers.length === 0) {
        onlineEl.textContent = 'none';
        return;
      }
      onlineUsers.forEach((u, idx) => {
        if (idx > 0) onlineEl.appendChild(document.createTextNode('\n'));
        const span = document.createElement('span');
        span.className = 'user-link';
        span.style.color = userColor(u);
        span.textContent = `* ${u}`;
        span.title = `click to @${u}`;
        span.onclick = () => insertMention(u);
        onlineEl.appendChild(span);
      });
    }

    function appendTextWithMentions(parent, text) {
      const re = /(@[a-zA-Z0-9_-]+|https?:\/\/[^\s<]+)/g;
      let last = 0;
      for (const match of text.matchAll(re)) {
        if (match.index > last) {
          parent.appendChild(document.createTextNode(text.slice(last, match.index)));
        }
        const token = match[0];
        if (token.startsWith('@')) {
          const span = document.createElement('span');
          span.className = 'mention';
          span.style.color = userColor(token.slice(1));
          span.textContent = token;
          parent.appendChild(span);
        } else {
          const a = document.createElement('a');
          a.href = token;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          a.textContent = token;
          parent.appendChild(a);
        }
        last = match.index + token.length;
      }
      if (last < text.length) {
        parent.appendChild(document.createTextNode(text.slice(last)));
      }
    }

    function formatTime(ts) {
      const d = new Date(ts);
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');
      return `${hh}:${mm}`;
    }

    function formatSeen(msg) {
      const seenOthers = (msg.seenBy || []).filter((u) => u !== msg.username);
      return seenOthers.length > 0 ? `seen: ${seenOthers.join(', ')}` : 'sent';
    }

    function createMessageEl(msg) {
      const wrap = document.createElement('div');
      wrap.className = isPingForMe(msg) ? 'msg ping' : 'msg';
      wrap.dataset.id = msg.id;

      const line = document.createElement('span');
      line.className = 'msg-line';
      line.appendChild(document.createTextNode(`[${formatTime(msg.createdAt)}] `));

      const sender = document.createElement('span');
      sender.className = 'user-link';
      sender.style.color = userColor(msg.username);
      sender.textContent = msg.username;
      sender.title = `click to @${msg.username}`;
      sender.onclick = () => insertMention(msg.username);
      line.appendChild(sender);

      line.appendChild(document.createTextNode(': '));
      appendTextWithMentions(line, msg.text);
      wrap.appendChild(line);

      const seenEl = document.createElement('span');
      seenEl.className = 'seen';
      seenEl.textContent = formatSeen(msg);
      wrap.appendChild(seenEl);

      if (isAdmin) {
        const del = document.createElement('a');
        del.href = '#';
        del.className = 'seen';
        del.textContent = '[x]';
        del.title = 'delete message';
        del.onclick = (e) => {
          e.preventDefault();
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: 'delete', id: msg.id }));
          }
        };
        wrap.appendChild(del);
      }

      return wrap;
    }

    function renderMessages(scrollToBottom = false) {
      const wasAtBottom =
        messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 30;

      messagesEl.textContent = '';
      if (messages.length === 0) {
        const empty = document.createElement('pre');
        empty.id = 'empty-msg';
        empty.textContent = 'no messages yet. say hi!';
        messagesEl.appendChild(empty);
        return;
      }

      const frag = document.createDocumentFragment();
      for (const msg of messages) {
        frag.appendChild(createMessageEl(msg));
      }
      messagesEl.appendChild(frag);

      if (scrollToBottom || wasAtBottom) {
        messagesEl.scrollTop = messagesEl.scrollHeight;
        jumpLatestEl.style.display = 'none';
      } else {
        jumpLatestEl.style.display = 'block';
      }
    }

    function appendMessage(msg, forceScroll = false) {
      const wasAtBottom =
        messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 30;
      const empty = document.getElementById('empty-msg');
      if (empty) empty.remove();

      messagesEl.appendChild(createMessageEl(msg));

      if (forceScroll || wasAtBottom) {
        messagesEl.scrollTop = messagesEl.scrollHeight;
        jumpLatestEl.style.display = 'none';
      } else {
        jumpLatestEl.style.display = 'block';
      }
    }

    jumpLinkEl.addEventListener('click', (e) => {
      e.preventDefault();
      messagesEl.scrollTop = messagesEl.scrollHeight;
      jumpLatestEl.style.display = 'none';
    });

    messagesEl.addEventListener('scroll', () => {
      const atBottom = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 30;
      if (atBottom) jumpLatestEl.style.display = 'none';
    });

    function updateSeenInDom(updates) {
      const map = new Map(updates.map((u) => [u.id, u.seenBy]));
      for (const msg of messages) {
        if (map.has(msg.id)) {
          msg.seenBy = map.get(msg.id);
          const el = messagesEl.querySelector(`[data-id="${msg.id}"] .seen`);
          if (el) {
            const seenOthers = msg.seenBy.filter((u) => u !== msg.username);
            el.textContent = seenOthers.length > 0
              ? `seen: ${seenOthers.join(', ')}`
              : 'sent';
          }
        }
      }
    }

    function markVisibleAsSeen() {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      if (document.visibilityState !== 'visible') return;
      if (!currentUser) return;

      const unseenIds = messages
        .filter((m) => !(m.seenBy || []).includes(currentUser))
        .map((m) => m.id);

      if (unseenIds.length > 0) {
        ws.send(JSON.stringify({ type: 'seen', messageIds: unseenIds }));
      }
    }

    const faviconEl = document.getElementById('favicon');
    const ICON_NORMAL = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23fff'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='18' text-anchor='middle' fill='%23000'%3E:3%3C/text%3E%3C/svg%3E";
    const ICON_MSG = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='18' text-anchor='middle' fill='%23fff'%3E:3%3C/text%3E%3C/svg%3E";
    const ICON_PING = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23d93025'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='20' font-weight='bold' text-anchor='middle' fill='%23fff'%3E!%3C/text%3E%3C/svg%3E";

    let flashTimer = null;
    let flashIsPing = false;

    function isPingForMe(msg) {
      if (!currentUser || !msg?.text) return false;
      const escaped = currentUser.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      return new RegExp(`@${escaped}(?![a-zA-Z0-9_-])`, 'i').test(msg.text);
    }

    function stopFlash() {
      if (flashTimer) {
        clearInterval(flashTimer);
        flashTimer = null;
      }
      flashIsPing = false;
      document.title = 'meowchat';
      faviconEl.href = ICON_NORMAL;
    }

    function notifyNewMessage(msg) {
      if (!msg || msg.username === currentUser) return;
      const ping = isPingForMe(msg);
      if (ping) playPingBeep();
      if (!document.hidden && document.hasFocus()) return;

      if (flashTimer && flashIsPing && !ping) return;

      stopFlash();
      flashIsPing = ping;
      const alertTitle = ping
        ? `(!) @${msg.username} pinged you!`
        : `(*) ${msg.username}: ${msg.text.slice(0, 24)}`;
      const alertIcon = ping ? ICON_PING : ICON_MSG;

      let on = true;
      document.title = alertTitle;
      faviconEl.href = alertIcon;
      flashTimer = setInterval(() => {
        on = !on;
        document.title = on ? alertTitle : 'meowchat';
        faviconEl.href = on ? alertIcon : ICON_NORMAL;
      }, 700);
    }

    function renderAddresses(urls) {
      const list = urls && urls.length > 0 ? urls : [window.location.origin];
      addressesEl.textContent = '';
      list.forEach((u, idx) => {
        if (idx > 0) addressesEl.appendChild(document.createTextNode('\n'));
        const span = document.createElement('span');
        span.className = 'addr-link';
        span.textContent = u;
        span.title = 'click to copy';
        span.onclick = async () => {
          try {
            await navigator.clipboard.writeText(u);
            span.textContent = `${u} (copied!)`;
            setTimeout(() => { span.textContent = u; }, 1200);
          } catch {}
        };
        addressesEl.appendChild(span);
      });
    }

    function renderTyping(typingUsers) {
      const others = (typingUsers || []).filter((u) => u !== currentUser);
      if (others.length === 0) {
        typingEl.innerHTML = '&nbsp;';
      } else if (others.length === 1) {
        typingEl.textContent = `${others[0]} is typing...`;
      } else {
        typingEl.textContent = `${others.join(', ')} are typing...`;
      }
    }

    let serverVersion = '';

    function connect() {
      const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${proto}//${window.location.host}/ws`);

      ws.onmessage = (event) => {
        let data;
        try {
          data = JSON.parse(event.data);
        } catch {
          return;
        }

        if (data.type === 'error') {
          window.location.href = '/login';
          return;
        }

        if (data.type === 'init') {
          if (serverVersion && data.version && serverVersion !== data.version) {
            window.location.reload();
            return;
          }
          serverVersion = data.version || '';
          connStatusEl.textContent = '[connected]';
          currentUser = data.username;
          isAdmin = Boolean(data.isAdmin);
          clearLink.style.display = isAdmin ? 'inline' : 'none';
          whoamiEl.textContent = isAdmin ? `user: ${currentUser} (admin)` : `user: ${currentUser}`;
          whoamiEl.style.color = userColor(currentUser);
          const prevLastId = messages[messages.length - 1]?.id;
          const nextLastId = data.messages?.[data.messages.length - 1]?.id;
          const sameHistory =
            messages.length > 0 &&
            messages.length === (data.messages?.length || 0) &&
            prevLastId === nextLastId;
          messages = data.messages || [];
          renderOnline(data.online);
          renderAddresses(data.addresses);
          renderTyping(data.typing || []);
          if (!sameHistory) renderMessages(true);
          markVisibleAsSeen();
          msgInput.focus();
        } else if (data.type === 'presence') {
          renderOnline(data.online);
        } else if (data.type === 'addresses') {
          renderAddresses(data.urls);
        } else if (data.type === 'typing') {
          renderTyping(data.typing || []);
        } else if (data.type === 'message') {
          messages.push(data.message);
          appendMessage(data.message, data.message.username === currentUser);
          markVisibleAsSeen();
          notifyNewMessage(data.message);
        } else if (data.type === 'seen') {
          updateSeenInDom(data.updates || []);
        } else if (data.type === 'delete') {
          messages = messages.filter((m) => m.id !== data.id);
          const el = messagesEl.querySelector(`[data-id="${data.id}"]`);
          if (el) el.remove();
          if (messages.length === 0) renderMessages(true);
        } else if (data.type === 'clear') {
          messages = [];
          renderMessages(true);
        }
      };

      ws.onclose = () => {
        connStatusEl.textContent = '[reconnecting...]';
        setTimeout(connect, 1500);
      };
    }

    const mentionMenuEl = document.getElementById('mention-menu');
    let mentionMatches = [];
    let mentionIndex = 0;

    function knownUsers() {
      const set = new Set(onlineUsers);
      for (const m of messages) set.add(m.username);
      set.delete(currentUser);
      return [...set].sort();
    }

    function closeMentionMenu() {
      mentionMenuEl.style.display = 'none';
      mentionMatches = [];
      mentionIndex = 0;
    }

    function renderMentionMenu() {
      if (mentionMatches.length === 0) {
        closeMentionMenu();
        return;
      }
      mentionMenuEl.textContent = '';
      mentionMatches.forEach((u, i) => {
        const item = document.createElement('div');
        item.className = i === mentionIndex ? 'mention-item active' : 'mention-item';
        item.style.color = userColor(u);
        item.textContent = `@${u}`;
        item.onmousedown = (e) => {
          e.preventDefault();
          insertMention(u);
        };
        mentionMenuEl.appendChild(item);
      });
      mentionMenuEl.style.display = 'block';
    }

    function updateMentionMenu() {
      const val = msgInput.value;
      const pos = msgInput.selectionStart ?? val.length;
      const before = val.slice(0, pos);
      const match = before.match(/(?:^|\s)@([a-zA-Z0-9_-]*)$/);
      if (!match) {
        closeMentionMenu();
        return;
      }
      const query = match[1].toLowerCase();
      mentionMatches = knownUsers().filter((u) => u.toLowerCase().startsWith(query));
      mentionIndex = 0;
      renderMentionMenu();
    }

    msgInput.addEventListener('keydown', (e) => {
      if (mentionMatches.length === 0) return;
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        mentionIndex = (mentionIndex + 1) % mentionMatches.length;
        renderMentionMenu();
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        mentionIndex = (mentionIndex - 1 + mentionMatches.length) % mentionMatches.length;
        renderMentionMenu();
      } else if (e.key === 'Tab' || e.key === 'Enter') {
        e.preventDefault();
        insertMention(mentionMatches[mentionIndex]);
      } else if (e.key === 'Escape') {
        closeMentionMenu();
      }
    });

    msgInput.addEventListener('blur', () => setTimeout(closeMentionMenu, 100));

    msgInput.addEventListener('input', () => {
      updateMentionMenu();
      if (!ws || ws.readyState !== WebSocket.OPEN) return;

      const hasText = msgInput.value.trim().length > 0;
      const now = Date.now();

      if (hasText && now - lastTypingSent > 1500) {
        ws.send(JSON.stringify({ type: 'typing', isTyping: true }));
        lastTypingSent = now;
      }

      clearTimeout(typingStopTimer);
      if (hasText) {
        typingStopTimer = setTimeout(() => {
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: 'typing', isTyping: false }));
          }
          lastTypingSent = 0;
        }, 2000);
      } else {
        ws.send(JSON.stringify({ type: 'typing', isTyping: false }));
        lastTypingSent = 0;
      }
    });

    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      if (!ws || ws.readyState !== WebSocket.OPEN) return;

      const text = msgInput.value.trim();
      if (!text) return;

      ws.send(JSON.stringify({ type: 'chat', text }));
      msgInput.value = '';
      clearTimeout(typingStopTimer);
      lastTypingSent = 0;
    });

    function onReturnToTab() {
      if (!document.hidden) stopFlash();
      markVisibleAsSeen();
    }

    document.addEventListener('visibilitychange', onReturnToTab);
    window.addEventListener('focus', onReturnToTab);

    clearLink.addEventListener('click', (e) => {
      e.preventDefault();
      if (!isAdmin || !ws || ws.readyState !== WebSocket.OPEN) return;
      if (confirm('clear all messages?')) {
        ws.send(JSON.stringify({ type: 'clear' }));
      }
    });

    logoutLink.addEventListener('click', async (e) => {
      e.preventDefault();
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/login';
    });

    connect();
  </script>
</body>
</html>
