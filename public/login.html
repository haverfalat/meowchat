<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>meowchat - login</title>
  <style>
    * {
      line-height: 14px;
    }
    body {
      font-family: monospace;
      margin-top: 40px;
    }
    hr {
      width: 340px;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 240px;
    }
    .row {
      display: flex;
      gap: 8px;
    }
    .row button {
      flex: 1;
    }
  </style>
</head>
<body>
  <div style="display: flex; flex-direction: column; align-items: center;">
    <div style="display: flex; align-items: center; gap: 16px;">
      <div style="font-size: 44px; line-height: 44px;">:3</div>
      <pre>meowchat
glhf!</pre>
    </div>
    <hr>
    <pre>login or create an account</pre>
    <form id="auth-form">
      <input id="username" type="text" placeholder="username" autocomplete="username" maxlength="24" autofocus required>
      <input id="password" type="password" placeholder="password" autocomplete="current-password" required>
      <input id="invite" type="text" placeholder="invite code (to register)" autocomplete="off">
      <div class="row">
        <button type="submit" data-action="login">login</button>
        <button type="button" id="register-btn">register</button>
      </div>
    </form>
    <pre id="status"></pre>
  </div>

  <script>
    const form = document.getElementById('auth-form');
    const registerBtn = document.getElementById('register-btn');
    const statusEl = document.getElementById('status');

    async function submitAuth(endpoint) {
      statusEl.textContent = '';
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const invite = document.getElementById('invite').value.trim();

      if (!username || !password) {
        statusEl.textContent = 'username and password required.';
        return;
      }

      const payload = endpoint === '/api/register'
        ? { username, password, invite }
        : { username, password };

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (!res.ok || !data.ok) {
          statusEl.textContent = data.error || 'auth failed.';
          return;
        }
        window.location.href = '/';
      } catch {
        statusEl.textContent = 'network error.';
      }
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      submitAuth('/api/login');
    });

    registerBtn.addEventListener('click', () => {
      submitAuth('/api/register');
    });

    document.getElementById('invite').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        submitAuth('/api/register');
      }
    });
  </script>
</body>
</html>
